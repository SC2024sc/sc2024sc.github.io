<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sea You Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sea You Surf Café, Arrifana: food and drinks menu in English, Português, Español and Deutsch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght,SOFT@9..144,500..900,0..100&display=swap">
<style>
/* Layout: one menu column; top = identity block, sticky bar = 3 tabs + section chips, then sections.
   Two looks share the same markup: data-look="poster" (70s surf poster: full-bleed colour bands, soft heavy serif, price stickers)
   and data-look="tasca" (Portuguese tasca: white paper, cobalt ink, azulejo band, condensed sign lettering, red prices). */
:root{
  /* logo palette */
  --sand:#f1cd7e; --ochre:#e4a851; --salmon:#db8f77; --terra:#b9532f; --teal:#59adae; --ocean:#29a3bf; --sage:#94c2a0; --green:#12705f;
  --brown:#2b1a10; --cream:#fff8ec;
  /* poster tokens */
  --p-bg:#fff8ec; --p-ink:#2b1a10;
  /* tasca tokens */
  --t-bg:#ffffff; --t-ink:#1d3c9e; --t-red:#c4371c; --t-soft:#5d6f9f; --t-line:#c9d3ef;
  --f-poster:"Fraunces",Georgia,serif; --f-poster-body:"DM Sans",system-ui,sans-serif; --f-item:"Bricolage Grotesque","DM Sans",system-ui,sans-serif; --pale:#fbf1d4; --tab:#1b7d99;
  --f-sign:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif; --f-sign-text:"Big Shoulders Text","Arial Narrow",sans-serif; --f-tasca-body:"Newsreader",Georgia,serif;
  --bg:var(--p-bg); --fg:var(--p-ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p-bg:#22150d;--p-ink:#fff1dd;--t-bg:#0c1838;--t-ink:#dfe6ff;--t-red:#ff8f72;--t-soft:#9fb0dd;--t-line:#24386e;color-scheme:dark}}
:root[data-theme="dark"]{--p-bg:#22150d;--p-ink:#fff1dd;--t-bg:#0c1838;--t-ink:#dfe6ff;--t-red:#ff8f72;--t-soft:#9fb0dd;--t-line:#24386e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-poster-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--ocean);outline-offset:3px}

/* ---------- shared structure ---------- */
.top{position:relative;overflow:hidden}
.top-in{padding-block:22px 26px;display:grid;justify-items:center;gap:14px;text-align:center;position:relative}
.logo{width:150px;height:150px;display:block}
.where{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.langs{display:flex;gap:4px}
.langs button{border:0;background:none;padding:8px 10px;font-weight:700;font-size:14px;letter-spacing:.08em;cursor:pointer;opacity:.55}
.langs button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.bar{position:relative;z-index:5;background:var(--bg)}
.bar-in{padding-block:10px 0;display:grid;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{cursor:pointer;padding:12px 6px}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chips a{white-space:nowrap;text-decoration:none;color:inherit;padding:7px 12px;font-size:14px;font-weight:600}
main{padding-bottom:0}
.sec{scroll-margin-top:118px;position:relative}
.sec-in{padding-block:30px 34px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec h2{margin:0;text-wrap:balance}
.sec-note{margin:6px 0 0;font-size:15px}
.items{list-style:none;margin:16px 0 0;padding:0;display:grid}
.it{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,auto);column-gap:40px;align-items:baseline;padding-block:12px}
.it-name{margin:0;min-width:0}
.it-alt{display:block;font-size:13px;opacity:.75;margin-top:1px}
.it-desc{grid-column:1;margin:4px 0 0;font-size:15px;max-width:52ch}
.it.np .it-desc,.it.np .it-x{grid-column:1/-1}
.it-x{grid-column:1;margin:4px 0 0;font-size:13.5px;font-weight:600}
.it-p{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.sec-x{margin:14px 0 0;font-size:14px;font-weight:600}
.flag{display:none}
.review .flag{display:inline-block;margin-left:6px;font:700 11px/1 var(--f-poster-body);letter-spacing:.04em;padding:3px 6px;border-radius:4px;background:#ffe39a;color:#2b1a10;vertical-align:3px;text-transform:uppercase}
.it.old{display:none}
.review .it.old{display:grid;opacity:.55}
.review-note{display:none}
.review .review-note{display:block;margin:14px 0 0;padding:10px 12px;font:14px/1.4 var(--f-poster-body);background:#ffe39a;color:#2b1a10;border-radius:6px}
footer .wrap{padding-block:26px 28px;display:grid;gap:16px;justify-items:center;text-align:center}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.links a{display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:inherit;font-weight:700;padding:11px 16px}
.links svg{width:18px;height:18px}
.legal{margin:0;font-size:12.5px;max-width:56ch;opacity:.75;font-family:var(--f-poster-body)}
.looks{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:5px;border-radius:999px;background:#111;color:#fff;font:600 13px/1 var(--f-poster-body);box-shadow:0 6px 24px rgba(0,0,0,.25);align-items:center}
.looks span{padding:0 8px 0 10px;opacity:.7}
.looks button{white-space:nowrap;border:0;border-radius:999px;padding:9px 14px;background:transparent;color:#fff;cursor:pointer;font-weight:700}
.looks button[aria-pressed="true"]{background:#fff;color:#111}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  .sec{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{transform:translateY(10px);opacity:.001}to{transform:none;opacity:1}}
}

/* ---------- desktop: sections as bubbles in two columns ---------- */
@media (min-width:900px){
  main{max-width:1180px;margin:0 auto;padding:24px 24px 0;display:flex;gap:24px;align-items:flex-start}
  .mcol{flex:1;min-width:0}
  body[data-look="poster"] .sec{break-inside:avoid;border-radius:32px;margin:0 0 24px;overflow:hidden;animation:none;scroll-margin-top:80px;display:inline-block;width:100%;vertical-align:top}
  [data-look="poster"] .sec::before{display:none}
  .sec .wrap{max-width:none}
  .bar-in,.mini-in,.mini-chips{max-width:1180px}
  .chips{flex-wrap:wrap;overflow:visible}
}

[data-look="poster"] .tabs button{border:2.5px solid var(--tab);color:var(--tab);background:transparent;border-radius:999px;font:800 17px/1 var(--f-poster);font-variation-settings:"SOFT" 100}
[data-look="poster"] .tabs button[aria-pressed="true"]{background:var(--tab);border-color:var(--tab);color:#fff}
[data-look="poster"] .chips a{border-radius:999px;background:color-mix(in srgb,var(--fg) 9%,transparent)}
[data-look="poster"] .chips a.on{background:var(--fg);color:var(--bg)}
[data-look="poster"] .sec{background:var(--band);color:var(--on);margin-top:18px}
[data-look="poster"] .sec::before{content:"";position:absolute;left:0;right:0;top:-17px;height:18px;
  background:radial-gradient(circle at 12px 18px,var(--band) 12px,transparent 12.5px) 0 0/24px 18px repeat-x}
[data-look="poster"] .sec h2{font:900 clamp(38px,10vw,52px)/.95 var(--f-poster);font-variation-settings:"SOFT" 100,"opsz" 144;letter-spacing:-.015em}
[data-look="poster"] .sec-head{align-items:center}
[data-look="poster"] .sec-price{flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--on);color:var(--band);font:800 19px/1 var(--f-poster);font-variation-settings:"SOFT" 100;transform:rotate(-9deg);text-align:center;font-variant-numeric:tabular-nums}
[data-look="poster"] .sec-note{font-weight:600}
[data-look="poster"] .it-x,[data-look="poster"] .sec-x{font:italic 600 14.5px/1.4 var(--f-poster-body)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo-link{display:block;border-radius:50%;line-height:0}
.mini{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--pale);box-shadow:0 2px 12px rgba(43,26,16,.14);padding-top:env(safe-area-inset-top,0px);transform:translateY(-110%);transition:transform .25s ease}
.mini.on{transform:none}
.mini-in{display:flex;align-items:center;justify-content:space-between;padding-block:8px 6px}
.mini-chips .chips{padding-bottom:8px}
.mini-logo img{width:46px;height:46px;display:block}
[data-look="poster"] .mini .langs button{padding:7px 13px;font-size:13px}
.foot-logo{width:96px;height:96px;margin-bottom:-14px}
.mascot{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:flex-end;gap:4px}
.mascot a{display:flex;align-items:flex-end;gap:2px;text-decoration:none;color:var(--brown)}
.mascot .bubble{background:#fff;color:var(--brown);font:700 13.5px/1.25 var(--f-poster-body);padding:9px 12px;border-radius:16px 16px 4px 16px;box-shadow:0 4px 14px rgba(43,26,16,.18);max-width:180px;margin-bottom:46px;margin-right:-6px;position:relative;z-index:1}
.mascot .bubble b{color:#e0a100;letter-spacing:1px}
.mascot svg.cup{width:112px;height:86px;overflow:visible;filter:drop-shadow(0 3px 4px rgba(43,26,16,.25))}
.mascot .x{position:absolute;top:-8px;right:-4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--brown);color:var(--cream);font:700 14px/1 var(--f-poster-body);cursor:pointer}
.mascot.gone{display:none}
@media (prefers-reduced-motion:no-preference){
  .mascot svg.cup{animation:ride 3s ease-in-out infinite;transform-origin:50% 90%}
  .mascot .board-g{transform-box:view-box;transform-origin:92px 112px;animation:sway 3s ease-in-out infinite}
  .mascot .arm{transform-box:view-box;transform-origin:128px 52px;animation:wave 1s ease-in-out infinite}
  .mascot .spark{animation:spark 1s ease-in-out infinite}
  .mascot .bubble{animation:pop .5s .8s both cubic-bezier(.3,1.6,.5,1),nudge 3s 1.3s ease-in-out infinite}
  @keyframes ride{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4px) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-3px) rotate(3deg)}}
  @keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
  @keyframes wave{50%{transform:rotate(-22deg)}}
  @keyframes spark{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes nudge{0%,62%,100%{transform:none}72%{transform:rotate(-3deg)}82%{transform:rotate(2deg)}}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
}
[data-look="poster"] .it{border-top:2px solid color-mix(in srgb,var(--on) 22%,transparent)}
[data-look="poster"] .it:first-child{border-top:0}
[data-look="poster"] .it-name{font:700 19px/1.2 var(--f-item);letter-spacing:-.01em}
[data-look="poster"] .it-alt{font:italic 500 13.5px/1.3 var(--f-poster-body)}
[data-look="poster"] .it-p{font:700 18px/1 var(--f-item)}
[data-look="poster"] footer{background:var(--fg);color:var(--bg)}
[data-look="poster"] .links a{border:2px solid currentColor;border-radius:999px}
[data-look="poster"] .soon{font:900 44px/1 var(--f-poster);font-variation-settings:"SOFT" 100;color:var(--ochre)}

</style>

    {n:"Whisky",d:"Jameson · Jack Daniel's · Cardhu",s:"check"},
    {n:T("Rum","Rum","Ron","Rum"),d:"Plantation · Diplomático",s:"check"},
  ]},
  {id:"licores", t:T("Porto, licores e shots","Port, liqueurs & shots","Oporto, licores y chupitos","Portwein, Liköre & Shots"), items:[
    {n:T("Porto branco · tawny","White port · tawny","Oporto blanco · tawny","Weißer Port · Tawny"),s:"check"},
    {n:"Brandymel · Licor Beirão · Amarguinha · Baileys",s:"check"},
    {n:"Shots",d:T("normal / premium","regular / premium","normal / premium","normal / premium"),p:"3,50 / 6,00",s:"check"},
  ]},
];

const MENUS = {winter:foodWinter, summer:foodSummer, drinks:drinksMenu};
const UI = {
  title:{winter:T("Ementa de inverno","Winter menu","Carta de invierno","Winterkarte"),summer:"Menu",drinks:T("Bebidas","Drinks","Bebidas","Getränke")},
  tab:{winter:T("Inverno","Winter","Invierno","Winter"),summer:"Principal",drinks:T("Bebidas","Drinks","Bebidas","Getränke")},
  maps:T("Como chegar","Directions","Cómo llegar","Anfahrt"),
  old:T("antigo","old","antiguo","alt"),
  review:T("Chávena pequena, favor grande: avalia-nos","Small cup, big favour: review us","Taza pequeña, favor grande: reséñanos","Kleine Tasse, große Bitte: bewerte uns"),
  close:T("Fechar","Close","Cerrar","Schließen"),
  legal:T("Preços em euros com IVA incluído à taxa em vigor. Nenhum prato, produto alimentar ou bebida, incluindo o couvert, pode ser cobrado se não for solicitado pelo cliente. Este estabelecimento dispõe de livro de reclamações.",
          "Prices in euros, VAT included at the current rate. No dish, food or drink, including couvert, can be charged if the customer did not order it. Complaints book available.",
          "Precios en euros con IVA incluido al tipo vigente. No se cobrará ningún plato, alimento ni bebida, incluido el cubierto, que el cliente no haya pedido. Hay libro de reclamaciones a su disposición.",
          "Preise in Euro inkl. der gültigen MwSt. Kein Gericht, Lebensmittel oder Getränk, auch kein Couvert, wird berechnet, wenn es nicht bestellt wurde. Beschwerdebuch vorhanden."),
};

/* ---------- rendering ---------- */
const BANDS=[["var(--ochre)","var(--brown)"],["var(--terra)","var(--cream)"],["var(--teal)","var(--brown)"],["var(--green)","var(--cream)"],["var(--salmon)","var(--brown)"],["var(--ocean)","var(--brown)"],["var(--sage)","var(--brown)"],["var(--sand)","var(--brown)"]];
const LANGS=["en","pt","es","de"];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("sy-lang")||(navigator.language||"en").slice(0,2).toLowerCase(); if(!LANGS.includes(lang))lang="en";
let menu=DEFAULT_MENU;
let look="poster";
const tr=v=>v==null?"":typeof v==="string"?v:(v[lang]??v.en);
const altName=v=>(v&&typeof v==="object"&&lang!=="pt"&&v.pt!==v[lang])?v.pt:"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=p=>lang==="en"?"€"+p.replace(/,/g,"."):p+" €";
const flag=s=>s==="check"?`<span class="flag">?</span>`:s==="old"?`<span class="flag">${esc(tr(UI.old))}</span>`:"";

function render(){
  document.documentElement.lang=lang==="pt"?"pt-PT":lang;
  document.body.dataset.look=look;
  document.body.classList.toggle("review",REVIEW);
  if(!window._chipsBound){window._chipsBound=1;document.querySelectorAll(".chips").forEach(cc=>cc.addEventListener("click",e=>{
  const a=e.target.closest("a[data-id]"); if(!a) return;
  e.preventDefault(); lock=Date.now()+1200;
  markChip(a.dataset.id);
  const sec=document.getElementById(a.dataset.id);
  const barH=document.getElementById("mini").offsetHeight;
  window.scrollTo({top:sec.getBoundingClientRect().top+window.scrollY-barH-16});
}))}
document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
    document.querySelectorAll(".tabs button").forEach(b=>{b.textContent=tr(UI.tab[b.dataset.m]);b.setAttribute("aria-pressed",b.dataset.m===menu)});
  document.getElementById("title").textContent=tr(UI.title[menu]);
  document.getElementById("maps-label").textContent=tr(UI.maps);
  document.getElementById("review-text").textContent=tr(UI.review);
  
  const secs=MENUS[menu].filter(s=>REVIEW||s.items.some(i=>i.s!=="old"));
  const chipHTML=secs.map(s=>`<a href="#${s.id}" data-id="${s.id}">${esc(tr(s.t))}</a>`).join("");document.querySelectorAll(".chips").forEach(c=>c.innerHTML=chipHTML);
  document.getElementById("menu").innerHTML=secs.map((s,i)=>{
    const [band,on]=BANDS[i%BANDS.length];
    const items=s.items.map(it=>{
      const a=altName(it.n);
      return `<li class="it${it.s==="old"?" old":""}${it.p?"":" np"}"><h3 class="it-name">${esc(tr(it.n))}${flag(it.s)}${a?`<span class="it-alt">${esc(a)}</span>`:""}</h3>${it.p?`<span class="it-p">${eur(it.p)}</span>`:"<span></span>"}${it.d?`<p class="it-desc">${esc(tr(it.d))}</p>`:""}${it.x?`<p class="it-x">${esc(tr(it.x))}</p>`:""}</li>`;
    }).join("");
    return `<section class="sec" id="${s.id}" style="--band:${band};--on:${on}"><div class="wrap sec-in">
      <div class="sec-head"><h2>${esc(tr(s.t))}</h2>${s.price?`<span class="sec-price">${eur(s.price)}</span>`:""}</div>
      ${s.note?`<p class="sec-note">${esc(tr(s.note))}</p>`:""}
      <ul class="items">${items}</ul>${s.x?`<p class="sec-x">${esc(tr(s.x))}</p>`:""}
    </div></section>`;
  }).join("");
  layout();spy();
}
const DESK=matchMedia("(min-width:900px)");
function layout(){
  const M=document.getElementById("menu"),secs=[...M.querySelectorAll(".sec")];
  if(!DESK.matches){M.replaceChildren(...secs);return}
  const c=[document.createElement("div"),document.createElement("div")];c.forEach(x=>x.className="mcol");M.replaceChildren(...c);
  secs.forEach(s=>c[0].appendChild(s));
  const h=secs.map(s=>s.offsetHeight+24),n=h.length,tot=h.reduce((a,b)=>a+b,0);let bm=1,best=1e9;
  if(n<=16){for(let m=1;m<(1<<n);m+=2){let a=0;for(let i=0;i<n;i++)if(m>>i&1)a+=h[i];const d=Math.abs(tot-2*a);if(d<best){best=d;bm=m}}}
  else{bm=0;let a=0,b=0;h.forEach((x,i)=>{if(a<=b){bm|=1<<i;a+=x}else b+=x})}
  secs.forEach((s,i)=>{if(!(bm>>i&1))c[1].appendChild(s)});
}
DESK.addEventListener("change",()=>{layout();spy()});
let obs;
let lock=0;
function markChip(id){document.querySelectorAll(".chips").forEach(c=>{c.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.id===id));const on=c.querySelector("a.on");if(on&&c.scrollWidth>c.clientWidth)c.scrollTo({left:on.offsetLeft-16})})}
function spy(){
  obs&&obs.disconnect();
  obs=new IntersectionObserver(es=>{if(Date.now()<lock)return;es.forEach(e=>{if(e.isIntersecting)markChip(e.target.id)})},{rootMargin:"-130px 0px -60% 0px"});
  document.querySelectorAll(".sec").forEach(s=>obs.observe(s));
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;store.set("sy-lang",lang);render()}));
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{menu=b.dataset.m;render();window.scrollTo({top:document.querySelector(".top").offsetHeight-1})}));
render();
</script>

<script>
(function(){const m=document.getElementById("mascot"),f=document.querySelector("footer");
const mn=document.getElementById("mini"),tp=document.querySelector(".top");
function fit(){mn.classList.toggle("on",scrollY>tp.offsetHeight-10);const over=innerHeight-f.getBoundingClientRect().top;m.style.transform=over>0?`translateY(${-over}px)`:"";}
addEventListener("scroll",fit,{passive:true});addEventListener("resize",fit);fit();})();
</script>
